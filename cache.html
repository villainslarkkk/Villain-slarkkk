<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Villain Slarkkk - Caching</title>
    <meta name="author" content="ArabPixel">
    <link rel="stylesheet" href="./includes/css/colors/default.css">
    <link rel="stylesheet" href="./includes/css/layouts/index.css">
    <link rel="stylesheet" href="./includes/css/cache.css">
    <link rel="stylesheet" href="./includes/css/glitch.css">
</head>

<body class="bg-gray-900 text-white">
    <main class="mainContainer">
        <section class="cache-screen">
            <div class="cache-title">Caching Villain Slarkkk</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="cache-subtitle" id="cacheStatus">Preparing...</div>
        </section>
        <div class="absolute bottom-10 text-center w-full">Firmware-Based Caching System</div>
    </main>

    <iframe id="cacheFrame" src="about:blank"></iframe>

    <script src="./includes/js/storage.js"></script>
    <script src="./includes/js/testMode.js"></script>
    <script src="./includes/js/firmware.js"></script>
    <script>
        var fwVersion = typeof getPs4FwVersion === 'function' ? getPs4FwVersion() : null;
        var targetPage = typeof getCachePage === 'function' ? getCachePage(fwVersion) : null;
        var fallbackMainPage = (typeof mainPage !== 'undefined' && mainPage) ? mainPage : './index.html';

        var statusEl = document.getElementById('cacheStatus');
        var fillEl = document.getElementById('progressFill');
        var frame = document.getElementById('cacheFrame');
        var settled = false;

        function finishAndRedirect(message, delayMs) {
            if (settled) return;
            settled = true;
            clearTimeout(stallTimer);
            statusEl.textContent = message;
            setTimeout(function () {
                window.location.replace(fallbackMainPage);
            }, delayMs);
        }

        window.addEventListener('message', function (event) {
            var data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'CACHE_PROGRESS') {
                if (data.percent >= 0) {
                    fillEl.style.width = data.percent + '%';
                    statusEl.textContent = 'Downloading... ' + data.percent + '%';
                } else {
                    statusEl.textContent = 'Downloading... (' + data.loaded + ' of ' + data.total + ')';
                }
            } else if (data.type === 'CACHE_COMPLETE' || data.type === 'CACHE_EXISTS') {
                fillEl.style.width = '100%';
                var msg = data.type === 'CACHE_EXISTS' ? 'Already cached! Redirecting...' : 'Done! Redirecting...';
                finishAndRedirect(msg, 1000);
            } else if (data.type === 'CACHE_CHECKING') {
                statusEl.textContent = 'Checking cache...';
            } else if (data.type === 'CACHE_DOWNLOADING') {
                statusEl.textContent = 'Caching files...';
            } else if (data.type === 'CACHE_ERROR') {
                var reason = data.reason || 'Unknown error';
                finishAndRedirect('Cache error: ' + reason, 3000);
            }
        }, false);

        frame.addEventListener('error', function () {
            finishAndRedirect('Cache page failed to load. Continuing...', 2000);
        });

        // Safety net if the iframe never posts a completion or error message
        var stallTimer = setTimeout(function () {
            finishAndRedirect('Cache timed out. Continuing...', 2000);
        }, 20000);

        statusEl.textContent = 'Starting cache for firmware ' + (fwVersion || 'unknown') + '...';
        if (targetPage) {
            frame.src = targetPage;
        } else {
            finishAndRedirect('No cache page for firmware ' + (fwVersion || 'unknown') + '. Continuing...', 2000);
        }
    </script>
</body>

</html>
